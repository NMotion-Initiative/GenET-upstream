_base_: ../base.yaml

data:
  expected_embodiments:
    - ARX-X5
    - aloha-agilex
    - franka-panda
    - piper
    - ur5-wsg
  require_bidirectional_pairs: true

model:
  backend: cosmos3_edge
  latent_channels: 48
  reference:
    enabled: false
  parallelism:
    data_parallel_shard_degree: 8
    data_parallel_replicate_degree: 1
    context_parallel_shard_degree: 1
    cfg_parallel_shard_degree: 1

train:
  stage: reference
  grad_accum_steps: 4

checkpoint:
  output_dir: outputs/stage2_no_ref_8gpu
