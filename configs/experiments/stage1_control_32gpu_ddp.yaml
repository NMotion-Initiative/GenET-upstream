_base_: ../base.yaml

# DDP deployment: every rank holds one complete model replica (3.37B fits a
# single H100), warm-started directly from the official safetensors snapshot.
# No FSDP sharding and no DCP conversion of the pretrained checkpoint.

data:
  expected_embodiments:
    - ARX-X5
    - aloha-agilex
    - franka-panda
    - piper
    - ur5-wsg
  require_bidirectional_pairs: true
  # Peak reserved memory measured at micro_batch_size=1 was ~24 GiB/80 GiB
  # (s1-smoke-5000st-20260806-071831, iter 1000); activations are the only
  # batch-scaled term under full activation checkpointing.
  micro_batch_size: 4

model:
  backend: cosmos3_edge
  # Adapter infers the native 48-channel Wan2.2 latent width from Cosmos.
  latent_channels: 48
  reference:
    enabled: false
  parallelism:
    data_parallel_shard_degree: 1
    data_parallel_replicate_degree: 32
    context_parallel_shard_degree: 1
    cfg_parallel_shard_degree: 1

train:
  stage: control
  grad_accum_steps: 1

checkpoint:
  output_dir: outputs/stage1_control_32gpu_ddp

# Online W&B: launch allowlists WANDB_* from the host env (/secure/path/wandb.env).
# Set HTTPS_PROXY / WANDB_BASE_URL if the cluster cannot reach api.wandb.ai directly.
# Eval videos prefer the processed val split; fall back to the train micro-batch
# when the val manifest path is unavailable on a node.
logging:
  wandb:
    mode: online
    project: genet
    group: stage1_control_ddp
    name: s1-ddp
  eval_video:
    enabled: true
    every_n_steps: 1000
    num_samples: 2
    manifest: /mnt/nvme/mds-cache/robotwin_v1/genet/processed/val/manifest.jsonl
    output_subdir: eval_videos
    log_to_wandb: true
    run_at_start: false
    num_sampling_steps: 35
