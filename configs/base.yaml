data:
  manifest: data/processed/train/manifest.jsonl
  fps: 16.0
  num_frames: 81
  reference_num_frames: 81
  height: 192
  width: 320
  temporal_compression_factor: 4
  action_dim: 64
  reference_mode: stored
  reference_seed: 1234

loader:
  micro_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

model:
  backend: toy
  dtype: bfloat16
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  latent_channels: 16
  patch_size: 2
  num_embodiments: 32
  freeze_vae: true
  activation_checkpointing: full
  compile: false
  source_control:
    enabled: true
    zero_init: true
    vision_scale: 1.0
    action_scale: 1.0
    domain_embedding_dim: 32
  reference:
    enabled: true
    projection_mode: shared
    routing: vision_action
    num_heads: 8
    dropout: 0.0
    gate_init: 0.0
    inject_every_n_layers: 1
    use_video: true
    use_action: true
  parallelism:
    data_parallel_shard_degree: 8
    data_parallel_replicate_degree: 4
    context_parallel_shard_degree: 1
    cfg_parallel_shard_degree: 1

train:
  stage: control
  seed: 42
  max_steps: 50000
  grad_accum_steps: 1
  base_lr: 1.0e-5
  new_module_lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 2000
  grad_clip: 1.0
  log_every: 10
  condition_dropout: 0.1
  loss:
    video: 1.0
    action: 1.0

checkpoint:
  output_dir: outputs/run
  resume: null
  warm_start: null
  save_every: 1000
  require_committed: true
  copy_shared_reference_to_dual: false
